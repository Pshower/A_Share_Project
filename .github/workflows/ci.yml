name: offline-tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
      - name: Install project dependencies
        run: pip install -r requirements-web.txt -c requirements-ci-constraints.txt
      - name: Offline test suite
        run: python -B -m pytest -q -p no:cacheprovider

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Web unit tests
        run: npm run test:unit
      - name: Typecheck and build
        run: npm run build
